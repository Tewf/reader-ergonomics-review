# Merged onto reader-ergonomics' own config, table by table; a value here wins (extending.md, the interface).
extends = "reader-ergonomics"

# The standard's three, and the answers file: it changes with every file it answers for, so it co-changes by construction.
[co_change]
exempt = ["standard.md", "llms.txt", "evidence/bibliography.md", "checks/judgments.toml"]

# The site loads the standard's own stylesheet (_standard/site.css, checked out in pages.yml), so there is none here
# to measure; reader-ergonomics extending.md asks such a repository to list none.
[readable_measure]
stylesheets = []

[sufficient_contrast]
stylesheets = []

# The headings the standard's decision-record shape requires (reader-ergonomics v1.20.0, shapes/decision-record.md), and
# the headings each shape of a review's files asks (shapes/*.md); a review in evidence/ and the small one in shapes/examples/
# are held to the same shapes.
[shape_conformance]
shapes = [
  { name = "decision record", files = ["decisions/0*.md"], required = ["Context", "Decision", "Consequences", "See also"] },
  { name = "frame", files = ["evidence/*/frame.md", "shapes/examples/*/frame.md"], required = ["The problem in one sentence", "What the field calls it", "What practice calls it", "Does the repository's name match", "Sub-questions"] },
  { name = "protocol", files = ["evidence/*/protocol.md", "shapes/examples/*/protocol.md"], required = ["Why grey literature", "Questions", "Existing reviews", "Formal search", "Grey search", "Stopping rule", "Selection", "Quality of grey sources", "Extraction and synthesis", "Not searched"] },
  { name = "sources", files = ["evidence/*/sources.md", "shapes/examples/*/sources.md"], required = ["Flow", "Formal", "Grey", "Left out"] },
  { name = "review", files = ["evidence/*/review.md", "shapes/examples/*/review.md"], required = ["Strand 0"] },
  { name = "against", files = ["evidence/*/against.md", "shapes/examples/*/against.md"], required = ["Against", "Disagreements", "Against the sources themselves"] },
  { name = "state of the art", files = ["evidence/*/state-of-the-art.md", "shapes/examples/*/state-of-the-art.md"], required = ["Q1"] },
  { name = "position", files = ["evidence/*/position.md", "shapes/examples/*/position.md"], required = ["Known", "Not found", "questions", "What this repository asks"] },
  { name = "baseline", files = ["evidence/*/baseline.md", "shapes/examples/*/baseline.md"], required = ["Compared with", "lacks", "measured", "finished"] },
]

# The review checks of checks/local/: which folders are reviews (globs on the folder), as the shapes and the family keep them.
[review]
roots = ["evidence/*", "shapes/examples/*"]

# Each shape links, or holds, a filled example of itself (the small review in shapes/examples/ links back with a Shape line).
[shape_example]
files = ["shapes/*.md"]
exempt = ["shapes/README.md", "shapes/examples/*"]
example_headings = ["Worked example"]

# The card: the principle groups, in the order standard.md shows them.
[standard_card]
facets = ["structure", "record"]

# Path questions are answered with their path quoted, so the quotes check stays strict.
[judgment_quotes]
optional = []

[bibliography_keys]
# A key names one work across the family (reader-ergonomics decision 0003); CI clones each name beside this repository.
family = ["reader-ergonomics", "reader-ergonomics-topic", "reader-ergonomics-software-design",
          "reader-ergonomics-academic", "ai-augmented-project"]
shared_links = []
