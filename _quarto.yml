project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!checks/"
  resources:
    - LICENSE
    - LICENSES/
    - "**/*.md"

website:
  title: "Review"
  description: "The literature review as a genre of the reader-ergonomics family: the five steps, the nine files, the grey score, the second rater and the flow, as shapes with examples and checks."
  site-url: "https://tewf.github.io/reader-ergonomics-review/"
  repo-url: "https://github.com/Tewf/reader-ergonomics-review"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - text: Standard
        href: standard.md
      - text: Shapes
        href: shapes/README.md
      - text: Principles
        href: principles/README.md
      - text: Evidence
        href: evidence/README.md
      - text: Decisions
        href: decisions/README.md
    right:
      - text: The standard
        href: https://tewf.github.io/reader-ergonomics/
      - text: The family
        href: https://tewf.github.io/reader-ergonomics-family/
  sidebar:
    style: docked
    search: true
    contents: auto

# The stylesheet is reader-ergonomics' own, checked out into _standard/ at build time
# (pages.yml), so the house style lives in one place; Quarto skips folders named with "_".
format:
  html:
    from: markdown-smart
    shift-heading-level-by: -1
    html-math-method: mathml
    toc: true
    toc-depth: 2
    theme:
      light: cosmo
      dark: darkly
    css: _standard/site.css
    link-external-newwindow: false
